name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK/WebKit deps (Wails)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (go:embed needs frontend/dist)
        run: cd frontend && npm ci && npm run build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
      - name: go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npx eslint src
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
      - name: mcp data parity (embedded JSON == frontend sources)
        working-directory: .
        run: |
          ./tools/mcp-gendata.sh
          git diff --exit-code -- internal/mcp/ frontend/src/fxBlocks.json || (echo 'internal/mcp/*.json рассинхронизированы с frontend/src — запусти make mcp-data и закоммить'; exit 1)

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          pip install ruff
          ruff check worker
      - name: unittest
        run: |
          # API-тесты воркера (continue/head/миграции) без них пропускаются
          pip install fastapi httpx numpy scipy librosa soundfile
          cd worker
          python3 -m unittest test_pure test_plancheck test_voice test_loudness test_grid test_vocal_leak test_roformer_stems \
            test_fx_engine test_fx_api test_fx_preview test_fx_kits test_sound_presets test_chordgrid test_perc test_master test_tails test_fx_tremolo test_drumsynth test_fx_kits_synth test_fx_tape_level test_fx_reverb_gate test_synth_fm_kit test_fx_kits_flac test_preset_parts test_genre_presets
