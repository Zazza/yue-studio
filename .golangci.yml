# Конфиг golangci-lint (v2). Запуск: golangci-lint run
version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - misspell
  settings:
    errcheck:
      exclude-functions:
        # рутинная очистка: игнор ошибок Close/Flush/Remove осознан
        - (*os.File).Close
        - (*bufio.Writer).Flush
        - os.Remove

issues:
  exclude-rules:
    # Wails-биндинги вызываются из шаблона по имени — «неиспользуемое» тут норма
    - path: app\.go
      linters:
        - unused
